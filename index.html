<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="An interactive, rotating diamond ring made of thousands of stars.">
  <title>LOVE ME — A Ring Made of Stars</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./script.js"></script>
</head>
<body>
  <main class="scene" aria-label="An animated silver diamond ring, drawn with sparkling particles">
    <canvas id="universe" aria-hidden="true"></canvas>
    <div class="film-grain" aria-hidden="true"></div>
    <div class="scene-top" aria-hidden="true">
      <span class="signature"><span class="star-icon">✧</span> LOVE ME <span class="signature-dim">/ 001</span></span>
      <span class="render-state"><span class="running-dot"></span> LIVE PARTICLE SCENE <span class="time" id="time">00:00</span></span>
    </div>
    <div class="hit-area" id="stage" role="img" aria-label="A rotating diamond ring made from tiny white glowing lights"></div>
    <div class="scene-bottom">
      <div class="scene-caption" aria-hidden="true"><span>✦</span> MADE OF STARDUST <span class="caption-divider">/</span> FOREVER IN MOTION</div>
      <button class="music-toggle" id="music-toggle" type="button" aria-label="Play background music" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13M9 9l12-2M9 18c0 1.7-1.7 3-3.8 3C3 21 1.5 19.9 1.5 18.2 1.5 16.5 3.1 15 5.2 15S9 16.3 9 18ZM21 16c0 1.7-1.7 3-3.8 3-2.1 0-3.7-1.1-3.7-2.8s1.6-3.2 3.7-3.2S21 14.3 21 16Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="music-action">PLAY SOUND</span>
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </div>
    <span class="accessibility-status" id="status" role="status" aria-live="polite"></span>
  </main>
  <noscript>This animation requires JavaScript.</noscript>
</body>
</html>
